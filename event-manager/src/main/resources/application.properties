spring.application.name=event-manager
server.port=${PORT:8080}

# Database (PostgreSQL). Override with environment variables; defaults suit local development.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DATABASE:eventmanager}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PW}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# SMTP (Mailtrap sandbox by default). If left empty the app still works; emails are just not delivered.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAILTRAP_USER:}
spring.mail.password=${MAILTRAP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security
# JWT_SECRET_KEY is REQUIRED and must be a Base64 string of at least 32 bytes.
# Generate one with:  openssl rand -base64 32
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration.ms=3600000

# Organizer sign-up is only possible with this invite code (disabled when empty).
app.organizer.invite-code=${ORGANIZER_INVITE_CODE:}

# Comma-separated list of browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


spring.profiles.default=local
